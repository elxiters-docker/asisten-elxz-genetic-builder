name: Web2APK Builder

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website yang akan diubah ke APK'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'ElxzApp'
      package_name:
        description: 'Package Name Android (contoh: com.elxz.app)'
        required: true
        default: 'com.elxz.app'
      version_name:
        description: 'Versi Aplikasi'
        required: false
        default: '1.0.0'
      version_code:
        description: 'Versi Kode'
        required: false
        default: '1'
      chat_id:
        description: 'ID Telegram User pemanggil'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  workflows: write

jobs:
  build-apk:
    name: Build Android WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Android WebView Project
        run: |
          mkdir -p build_project
          cd build_project
          
          # Inisialisasi template Cordova / Capacitor WebView modern
          npm install -g cordova
          cordova create app ${{ github.event.inputs.package_name }} "${{ github.event.inputs.app_name }}"
          cd app
          cordova platform add android@12.0.1
          
          # Konfigurasi URL website ke config.xml
          sed -i 's|<content src="index.html" />|<content src="${{ github.event.inputs.web_url }}" />|g' config.xml
          sed -i 's|<allow-intent href="http://*//*" />|<allow-navigation href="*" />\n    <allow-intent href="*" />|g' config.xml
          
          # Build APK Release
          cordova build android --release -- --packageType=apk
          
          # Simpan APK ke folder output
          mkdir -p ../../output
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../../output/${{ github.event.inputs.app_name }}.apk || \
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../../output/${{ github.event.inputs.app_name }}.apk || \
          find platforms/android/ -name "*.apk" -exec cp {} ../../output/${{ github.event.inputs.app_name }}.apk \;

      - name: Sign APK (Debug Keystore)
        run: |
          cd output
          # Sign dengan debug keystore agar siap diinstall di Android langsung
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ~/.android/debug.keystore -storepass android -keypass android "${{ github.event.inputs.app_name }}.apk" androiddebugkey || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: output/*.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}"
          body: |
            🎉 **Build APK Sukses!**
            - **Nama Aplikasi:** ${{ github.event.inputs.app_name }}
            - **Package Name:** ${{ github.event.inputs.package_name }}
            - **URL Website:** ${{ github.event.inputs.web_url }}
            - **Build Run ID:** #${{ github.run_number }}
            - **Powered by:** ASISTEN ELXZ BUILD v5 (Owner: Elxz)
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
