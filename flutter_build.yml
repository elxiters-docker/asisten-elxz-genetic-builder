name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL Repository GitHub Flutter'
        required: true
      branch:
        description: 'Branch repository'
        required: false
        default: 'main'
      app_name:
        description: 'Nama Aplikasi'
        required: false
        default: 'FlutterApp'
      chat_id:
        description: 'ID Telegram User'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  workflows: write

jobs:
  build-flutter:
    name: Build Flutter APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo_url }}
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          flutter build apk --release
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/${{ github.event.inputs.app_name }}.apk || \
          cp build/app/outputs/apk/release/app-release.apk output/${{ github.event.inputs.app_name }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: output/*.apk
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: "Release ${{ github.event.inputs.app_name }} v1.0.${{ github.run_number }}"
          body: |
            📱 **Flutter APK Selesai Dibuat!**
            - **App:** ${{ github.event.inputs.app_name }}
            - **Repo:** ${{ github.event.inputs.repo_url }}
            - **Branch:** ${{ github.event.inputs.branch }}
            - **Owner:** Elxz
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
